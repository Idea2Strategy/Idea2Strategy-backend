spring:
  application:
    name: backend-api
  main:
    banner-mode: "off"

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

email:
  delivery:
    enabled: ${EMAIL_DELIVERY_ENABLED:false}
    provider: ${EMAIL_DELIVERY_PROVIDER:ses}
    from-address: ${EMAIL_DELIVERY_FROM_ADDRESS:}
    aws-region: ${EMAIL_DELIVERY_AWS_REGION:ap-northeast-2}
    base-url: ${EMAIL_DELIVERY_BASE_URL:}

idea2strategy:
  operator-auth:
    enabled: ${OPERATOR_AUTH_ENABLED:false}
    secure-cookie: ${OPERATOR_AUTH_SECURE_COOKIE:true}
    idle-lifetime: ${OPERATOR_AUTH_IDLE_LIFETIME:PT15M}
    absolute-lifetime: ${OPERATOR_AUTH_ABSOLUTE_LIFETIME:PT8H}
    password-memory-kb: ${OPERATOR_AUTH_PASSWORD_MEMORY_KB:65536}
    password-iterations: ${OPERATOR_AUTH_PASSWORD_ITERATIONS:3}
    password-parallelism: ${OPERATOR_AUTH_PASSWORD_PARALLELISM:1}
    throttle-redis-uri: ${OPERATOR_AUTH_THROTTLE_REDIS_URI:}
    totp-encryption:
      version: ${OPERATOR_AUTH_TOTP_KEY_VERSION:0}
      key: ${OPERATOR_AUTH_TOTP_KEY:}
    session-hmac:
      version: ${OPERATOR_AUTH_SESSION_HMAC_KEY_VERSION:0}
      key: ${OPERATOR_AUTH_SESSION_HMAC_KEY:}
    csrf-hmac:
      version: ${OPERATOR_AUTH_CSRF_HMAC_KEY_VERSION:0}
      key: ${OPERATOR_AUTH_CSRF_HMAC_KEY:}
    source-hmac:
      version: ${OPERATOR_AUTH_SOURCE_HMAC_KEY_VERSION:0}
      key: ${OPERATOR_AUTH_SOURCE_HMAC_KEY:}
    login-hmac:
      version: ${OPERATOR_AUTH_LOGIN_HMAC_KEY_VERSION:0}
      key: ${OPERATOR_AUTH_LOGIN_HMAC_KEY:}
  operator-rbac:
    read-guard:
      enabled: ${OPERATOR_RBAC_READ_ENABLED:false}
      catalog-version: ${OPERATOR_RBAC_CATALOG_VERSION:}
      catalog-read-permission-id: ${OPERATOR_RBAC_CATALOG_READ_PERMISSION_ID:}
      assignment-read-permission-id: ${OPERATOR_RBAC_ASSIGNMENT_READ_PERMISSION_ID:}
      catalog-read-mfa-required: ${OPERATOR_RBAC_CATALOG_READ_MFA_REQUIRED:true}
      assignment-read-mfa-required: ${OPERATOR_RBAC_ASSIGNMENT_READ_MFA_REQUIRED:true}
