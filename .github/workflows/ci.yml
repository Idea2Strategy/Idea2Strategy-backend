name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify immutable GitHub Actions references
        run: |
          chmod +x scripts/test-github-actions-pins.sh
          ./scripts/test-github-actions-pins.sh
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Run Gradle tests
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon
      - name: Verify container contracts
        run: |
          chmod +x scripts/test-container-contracts.sh
          ./scripts/test-container-contracts.sh
